<style>
:root{--bg:#05060F;--tx:#E6ECFF;--mu:#8C96B8;--mu2:#AEB7D8;--cy:#6EF3FF;--vi:#B9A8FF;--pk:#FF3D9A;--line:rgba(110,243,255,.22);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bg)}
button,a{font:inherit;color:inherit}
a{text-decoration:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--cy);outline-offset:3px}
.hidden{display:none !important}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.stars{background-image:radial-gradient(1px 1px at 20% 30%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 70% 20%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 40% 80%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 85% 65%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 10% 70%,#fff6 50%,transparent 51%),radial-gradient(1.2px 1.2px at 55% 50%,#fff4 50%,transparent 51%);background-size:420px 420px}
.nebula{position:fixed;inset:0;pointer-events:none;background:radial-gradient(900px 500px at 75% 0%,rgba(130,90,255,.22),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(110,243,255,.12),transparent 60%)}
.wrap{position:relative;max-width:1320px;margin:0 auto;padding:14px 14px 56px;display:flex;flex-direction:column;gap:22px}
.panel{background:linear-gradient(180deg,rgba(20,26,58,.72),rgba(10,13,32,.72));border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brk{position:relative}
.brk::before,.brk::after{content:"";position:absolute;width:18px;height:18px;border-color:var(--cy);border-style:solid;pointer-events:none}
.brk::before{top:-1px;left:-1px;border-width:2px 0 0 2px;border-top-left-radius:6px}
.brk::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;border-bottom-right-radius:6px}

/* header & nav */
.top{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 14px}
.brand{display:flex;align-items:center;gap:12px;border:none;background:none;padding:0;cursor:pointer;text-align:left}
.brand b{display:block;font-size:15px;font-weight:700}
.brand small{display:block;font-size:11px;color:var(--mu)}
.orbdot{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#6EF3FF 35%,#6A4BFF 75%);flex-shrink:0}
.navbtn{min-height:40px;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;letter-spacing:.06em;cursor:pointer;background:transparent;color:var(--mu2)}
.navbtn[aria-current="page"]{background:rgba(110,243,255,.14);color:#fff;border-color:var(--cy)}
.tnav{display:flex;gap:6px}
.bnav{display:none;position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;justify-content:space-around;gap:6px;padding:8px}
.bnav .navbtn{flex:1;min-height:50px;font-size:12px}
.online{font-size:11px;color:var(--mu);display:inline-flex;align-items:center;gap:8px}
@media (max-width:760px){.tnav{display:none}.bnav{display:flex}.wrap{padding-bottom:120px}.hidem{display:none !important}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer;border:none;text-align:center}
.btn-glow{background:linear-gradient(90deg,#6EF3FF,#B9A8FF);color:#05060F;box-shadow:0 0 24px rgba(110,243,255,.35)}
.btn-line{border:1px solid rgba(110,243,255,.5);background:rgba(110,243,255,.06);color:var(--tx)}
.btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.seg{min-height:52px;border:1px solid var(--line);border-radius:12px;padding:8px 16px;cursor:pointer;text-align:left;background:transparent;color:var(--mu2);display:flex;flex-direction:column;gap:2px}
.seg[aria-pressed="true"]{background:rgba(110,243,255,.14);color:#fff;border-color:var(--cy);box-shadow:0 0 18px rgba(110,243,255,.3)}

/* animations */
@keyframes glitch{0%,92%,100%{text-shadow:0 0 24px rgba(110,243,255,.35)}93%{text-shadow:-3px 0 #FF3D9A,3px 0 #6EF3FF}95%{text-shadow:3px 0 #FF3D9A,-3px 0 #6EF3FF}97%{text-shadow:0 0 24px rgba(110,243,255,.35)}}
.glitch{animation:glitch 5s infinite}
@keyframes corepulse{0%,100%{box-shadow:0 0 40px 8px rgba(110,243,255,.35),0 0 120px 30px rgba(130,90,255,.25)}50%{box-shadow:0 0 60px 14px rgba(110,243,255,.5),0 0 160px 50px rgba(130,90,255,.32)}}
.core{animation:corepulse 4s ease-in-out infinite}
@keyframes marq{to{transform:translateX(-50%)}}
.stream{display:flex;width:max-content;gap:28px;animation:marq 50s linear infinite}
@keyframes sweep{0%{top:-10%}100%{top:110%}}
.scan{position:absolute;left:0;right:0;height:60px;background:linear-gradient(180deg,transparent,rgba(110,243,255,.14),transparent);animation:sweep 4s linear infinite;pointer-events:none}
@keyframes eq{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
.eqb{transform-origin:bottom;animation:eq 1.2s ease-in-out infinite;width:clamp(4px,.8vw,8px);border-radius:3px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.blink{animation:blink 1.2s steps(2) infinite}
@keyframes materialize{from{opacity:0;filter:blur(8px);transform:translateY(14px) scale(.98)}to{opacity:1;filter:none;transform:none}}
.mat{animation:materialize .7s cubic-bezier(.2,.7,.2,1) both}
.mat2{animation:materialize .7s .12s cubic-bezier(.2,.7,.2,1) both}
.mat3{animation:materialize .7s .24s cubic-bezier(.2,.7,.2,1) both}
@keyframes capin{from{opacity:0;transform:translateX(-24px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.capin{animation:capin .7s cubic-bezier(.2,.7,.2,1) both}
.quiet .mat,.quiet .mat2,.quiet .mat3,.quiet .capin{animation:none}
@keyframes shim{from{transform:translateX(-140%)}to{transform:translateX(320%)}}
.shim{position:absolute;top:0;bottom:0;left:0;width:35%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.13),transparent);animation:shim 4s ease-in-out infinite;pointer-events:none}
@keyframes livecap{0%,100%{box-shadow:0 0 18px var(--g),inset 0 0 20px var(--g)}50%{box-shadow:0 0 44px var(--g),0 0 0 2px #FF3D9A,inset 0 0 26px var(--g)}}
.livecap{animation:livecap 1.8s ease-in-out infinite}
@keyframes lanef{to{background-position:40px 0}}
.lanef{position:absolute;left:0;right:0;bottom:0;height:2px;background:repeating-linear-gradient(90deg,rgba(110,243,255,.55) 0 10px,transparent 10px 40px);background-size:40px 2px;animation:lanef 1.2s linear infinite}
@keyframes ringspin{to{transform:rotate(360deg)}}
.ringspin{animation:ringspin 18s linear infinite}
.cap{transition:transform .25s ease,filter .25s ease}
.cap:hover{transform:translateY(-3px) scale(1.02);filter:brightness(1.15)}

/* motifs */
.mo{width:100%;height:100%;display:block;overflow:visible}
.mo *{transform-box:fill-box;transform-origin:center}
@keyframes mer{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.06)}}
.mer{animation:mer 4s ease-in-out infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.mo .spinv{transform-box:view-box;transform-origin:50px 50px;animation:rot 6s linear infinite}
@keyframes bar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.mo .bar{transform-origin:center bottom;animation:bar 2.2s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:var(--len)}55%,100%{stroke-dashoffset:0}}
.draw{stroke-dasharray:var(--len);animation:draw 3.2s ease-out infinite}
@keyframes blip{0%,45%{opacity:0;transform:scale(.4)}55%{opacity:1;transform:scale(1.3)}85%,100%{opacity:0;transform:scale(1)}}
.blip{animation:blip 3s ease-out infinite}
@keyframes leaf{0%,35%{transform:scale(0)}65%,100%{transform:scale(1)}}
.mo .leaf{animation:leaf 3.2s ease-out infinite}
@keyframes ringp{0%{opacity:.8;transform:scale(.9)}100%{opacity:0;transform:scale(1.25)}}
.ringp{animation:ringp 2.4s ease-out infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
.flow line{stroke-dasharray:3 5;animation:flow 1.1s linear infinite}
@keyframes node{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}
.mo .node{animation:node 2.4s ease-in-out infinite}

/* orbit system */
.hero{position:relative;border:1px solid rgba(110,243,255,.18);border-radius:26px;padding:clamp(20px,4vw,40px) clamp(14px,4vw,40px) 26px;overflow:hidden;background:radial-gradient(70% 60% at 50% 60%,rgba(70,60,180,.25),transparent 70%)}
.hero h1{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px}
.hero h1 .city{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:clamp(12px,1.4vw,15px);font-weight:700;letter-spacing:.45em;text-transform:uppercase;color:var(--cy);padding-left:.45em}
.hero h1 .big{display:block;font-size:clamp(34px,7.2vw,92px);line-height:.95;font-weight:700;letter-spacing:-.03em;text-transform:uppercase;text-wrap:balance;background:linear-gradient(100deg,#fff 0%,#BFF8FF 35%,#B9A8FF 70%,#FF9AD1 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sys{--S:clamp(260px,calc(100vw - 72px),760px);position:relative;width:var(--S);height:calc(var(--S) * .62);margin:0 auto;perspective:1200px}
.plane{position:absolute;left:0;top:50%;width:var(--S);height:var(--S);margin-top:calc(var(--S) * -.5);transform:rotateX(66deg);transform-style:preserve-3d}
.orb{position:absolute;left:50%;top:50%;border:1px solid var(--line);border-radius:50%;transform:translate(-50%,-50%)}
.arm{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;animation:spin var(--d) linear infinite;animation-delay:var(--dl)}
.pos{position:absolute;top:0;transform-style:preserve-3d}
.planet{position:absolute;left:0;top:0;margin-left:calc(var(--p) * -.5);margin-top:calc(var(--p) * -.5);width:var(--p);height:var(--p);border-radius:50%;border:none;cursor:pointer;padding:0;animation:counter var(--d) linear infinite;animation-delay:var(--dl);transform-style:preserve-3d}
.planet .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.planet .tag{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--tx);background:rgba(5,6,15,.75);border:1px solid;border-radius:6px;padding:2px 6px}
.sys:hover .arm,.sys:hover .planet,.sys:focus-within .arm,.sys:focus-within .planet{animation-play-state:paused}
@keyframes spin{to{transform:rotateZ(360deg)}}
@keyframes counter{from{transform:rotateZ(0deg) rotateX(-66deg)}to{transform:rotateZ(-360deg) rotateX(-66deg)}}
.corebig{position:absolute;left:50%;top:50%;width:clamp(62px,13vw,130px);height:clamp(62px,13vw,130px);transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,#BFF8FF 18%,#6EF3FF 38%,#6A4BFF 72%,#2A1A7A 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#05060F;text-align:center}

/* jaringan (hero) */
.net{position:relative;width:100%;height:clamp(400px,56vw,580px);margin-top:6px;touch-action:pan-y}
.net canvas{position:absolute;inset:0;display:block}
.hub{--ds:clamp(50px,6vw,66px);position:absolute;transform:translate(-50%,calc(var(--ds) * -.5));border:none;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--tx);z-index:2}
.hub .dot{position:relative;width:var(--ds);height:var(--ds);border-radius:50%;background:radial-gradient(circle,rgba(14,18,44,.75),rgba(5,6,15,.96));border:1px solid var(--c);box-shadow:0 0 24px var(--b),inset 0 0 16px var(--b);display:flex;align-items:center;justify-content:center;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.hub .dot::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid var(--c);opacity:0;animation:hubring 2.8s ease-out infinite;animation-delay:var(--hd)}
@keyframes hubring{0%{opacity:.8;transform:scale(.85)}100%{opacity:0;transform:scale(1.45)}}
.hub:hover .dot,.hub:focus-visible .dot{transform:scale(1.14)}
.hub .no{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--c);color:#05060F;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace}
.hub .tag{font-size:11px;font-weight:700;letter-spacing:.06em;white-space:nowrap;background:rgba(5,6,15,.82);border:1px solid var(--c);border-radius:6px;padding:2px 7px}
.net .corebig{z-index:1}
.net .corebig::before,.net .corebig::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(110,243,255,.5);animation:hubring 3.2s ease-out infinite}
.net .corebig::after{animation-delay:1.6s}
@media (max-width:600px){.hub{--ds:46px}.hub .tag{font-size:9px;padding:2px 5px;letter-spacing:.02em}}
/* misc */
.label{font-size:11px;letter-spacing:.14em;color:var(--mu)}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.lane{position:relative;flex:1;height:196px;border-radius:14px;background:repeating-linear-gradient(90deg,rgba(110,243,255,.05) 0 1px,transparent 1px 40px),rgba(255,255,255,.02);border:1px solid rgba(110,243,255,.12)}
.capsule{position:absolute;top:10px;bottom:10px;border:1px solid;border-radius:12px;cursor:pointer;text-align:left;padding:12px 62px 12px 14px;color:var(--tx);display:flex;flex-direction:column;gap:6px;overflow:hidden}
.empty{border:1px dashed rgba(110,243,255,.35);border-radius:12px;padding:16px;font-size:14px;line-height:1.5;color:var(--mu2)}
.frame{width:100%;border:0;border-radius:12px;background:#fff}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tabs button{min-height:42px;border:1px solid var(--line);border-radius:10px;padding:6px 2px;font-size:12px;font-weight:700;letter-spacing:.04em;cursor:pointer;background:transparent;color:var(--mu2)}
.tabs button[aria-selected="true"]{background:rgba(110,243,255,.14);color:#fff;border-color:var(--cy)}

/* responsif */
h1,h2,h3,p{overflow-wrap:break-word}
.tl-desk{display:block}.tl-mob{display:none}
.capsule-s{position:relative;border:1px solid;border-radius:14px;cursor:pointer;text-align:left;padding:16px 84px 16px 16px;color:var(--tx);display:flex;flex-direction:column;gap:8px;overflow:hidden;min-height:150px}
.grid-slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.stage{aspect-ratio:16/9}
.hint-m{display:none}
@media (max-width:1099px){.tl-desk{display:none}.tl-mob{display:flex}}
@media (max-width:820px){.hero{border-radius:20px}.panel{border-radius:16px}}
@media (max-width:600px){
  .planet .tag{display:none}
  .hint-m{display:block}
  .stage{aspect-ratio:auto;min-height:280px;gap:16px}
  .wrap{padding-left:10px;padding-right:10px;gap:18px}
  .hero{padding-left:12px;padding-right:12px}
  .btn{width:100%}
  .btn-row-m{flex-direction:column;align-items:stretch;width:100%}
}
@media (max-width:600px) and (pointer:coarse){.planet{--p:44px !important}}
@media (prefers-reduced-motion:reduce){.hub .dot::after,.net .corebig::before,.net .corebig::after{animation:none !important;opacity:0}.arm,.planet,.core,.stream,.scan,.eqb,.blink,.glitch,.mat,.mat2,.mat3,.mo *,.capin,.shim,.livecap,.lanef,.ringspin{animation:none !important}.arm{transform:rotateZ(var(--a))}.planet{transform:rotateZ(calc(var(--a) * -1)) rotateX(-66deg)}}
</style>

<script>
/* ===================== DATA ACARA (dari nota dinas) ===================== */
const SESI = {

    bg: 'Tata kelola internet global berubah cepat, ditandai menguatnya regulasi platform, pelindungan data, dan isu kedaulatan digital. Sesi ini membahas perkembangan kebijakan internet global serta arah kebijakan internet yang perlu dimiliki Indonesia.',
    tujuan: ['Memetakan lanskap kebijakan internet global', 'Merumuskan arah kebijakan internet Indonesia'],
    lingkup: ['Tren regulasi internet global', 'Tata kelola platform, data, dan kedaulatan digital', 'Praktik baik negara lain'],

          <span class="mono" style="font-size:11px;letter-spacing:.12em;color:#FF9AD1">ISHOMA · 12.00–13.30 WIB</span>
          <span style="font-size:20px;font-weight:700;line-height:1.25">Ruang orbit bebas: ngobrol santai dengan peserta dari kedua kanal</span>
          ${has(CONFIG.rehat) ? `<a class="btn" href="${CONFIG.rehat}" target="_blank" rel="noopener" style="background:linear-gradient(90deg,#FF9AD1,#B9A8FF);color:#05060F">Masuk ruang rehat ↗</a>` : `<div class="empty">Tautan ruang rehat belum dipasang. Isi <b>rehat</b> di PENGATURAN.</div>`}
        </div>
      </aside>
    </div></div>`;
}

/* ---------- Jaringan animasi (kanvas) ---------- */
let netStop = null;
function initNet() {
  if (netStop) netStop();
  const wrap = document.getElementById('net'), cv = document.getElementById('netc');
  if (!wrap || !cv || !cv.getContext || !window.requestAnimationFrame) return;
  const ctx = cv.getContext('2d');
  if (!ctx) return;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const hubs = [...wrap.querySelectorAll('.hub')].map((el) => ({ x: +el.dataset.x / 100, y: +el.dataset.y / 100, rgb: el.dataset.rgb }));
  let W = 0, H = 0, parts = [], raf = 0, ptr = { x: -9999, y: -9999 }, alive = true;
  function size() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = wrap.clientWidth; H = wrap.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.max(30, Math.min(110, Math.round(W * H / 6500)));
    parts = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .4, vy: (Math.random() - .5) * .4, r: Math.random() * 1.6 + .5 }));
    if (reduce) draw(0);
  }
  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    const cx = W / 2, cy = H / 2, link = Math.min(120, W / 7);
    for (const p of parts) {
      if (!reduce) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > W) p.vx *= -1;
        if (p.y < 0 || p.y > H) p.vy *= -1;
        const dx = p.x - ptr.x, dy = p.y - ptr.y, d = Math.hypot(dx, dy);
        if (d < 110 && d > 0) { p.x += dx / d * 1.2; p.y += dy / d * 1.2; }
      }
    }
    ctx.lineWidth = 1;
    for (let i = 0; i < parts.length; i++) {
      const a = parts[i];
      for (let j = i + 1; j < parts.length; j++) {
        const b = parts[j], d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < link) { ctx.strokeStyle = `rgba(110,243,255,${(1 - d / link) * .22})`; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
      }
      const pd = Math.hypot(a.x - ptr.x, a.y - ptr.y);
      if (pd < 170) { ctx.strokeStyle = `rgba(185,168,255,${(1 - pd / 170) * .5})`; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(ptr.x, ptr.y); ctx.stroke(); }
    }
    hubs.forEach((h, i) => {
      const hx = h.x * W, hy = h.y * H;
      const g = ctx.createLinearGradient(hx, hy, cx, cy);
      g.addColorStop(0, `rgba(${h.rgb},.75)`); g.addColorStop(1, 'rgba(110,243,255,.15)');
      ctx.strokeStyle = g; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(cx, cy); ctx.stroke();
      const nx = hubs[(i + 1) % hubs.length];
      ctx.strokeStyle = `rgba(${h.rgb},.18)`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(nx.x * W, nx.y * H); ctx.stroke();
      for (const p of parts) { const d = Math.hypot(p.x - hx, p.y - hy); if (d < 140) { ctx.strokeStyle = `rgba(${h.rgb},${(1 - d / 140) * .45})`; ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(p.x, p.y); ctx.stroke(); } }
      for (let k = 0; k < 3; k++) {
        const tt = reduce ? (k + 1) / 4 : ((t / 2600) + k / 3 + i * .17) % 1;
        const px = hx + (cx - hx) * tt, py = hy + (cy - hy) * tt;
        const rg = ctx.createRadialGradient(px, py, 0, px, py, 7);
        rg.addColorStop(0, `rgba(${h.rgb},1)`); rg.addColorStop(1, `rgba(${h.rgb},0)`);
        ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI * 2); ctx.fill();
      }
    });
    ctx.fillStyle = 'rgba(230,236,255,.75)';
    for (const p of parts) { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
  }
  function loop(t) { if (!alive || !cv.isConnected) return stop(); draw(t); raf = requestAnimationFrame(loop); }
  const move = (e) => { const r = wrap.getBoundingClientRect(); ptr = { x: e.clientX - r.left, y: e.clientY - r.top }; };
  const leave = () => { ptr = { x: -9999, y: -9999 }; };
  wrap.addEventListener('pointermove', move); wrap.addEventListener('pointerdown', move); wrap.addEventListener('pointerleave', leave);
  const ro = window.ResizeObserver ? new ResizeObserver(size) : null; if (ro) ro.observe(wrap); else window.addEventListener('resize', size);
  function stop() { alive = false; cancelAnimationFrame(raf); if (ro) ro.disconnect(); else window.removeEventListener('resize', size); netStop = null; }
  netStop = stop;
  size();
  if (!reduce) raf = requestAnimationFrame(loop);
}

/* ---------- Render & event ---------- */
function render(quiet) {
  const views = { beranda: vBeranda, agenda: vAgenda, sesi: vSesi, live: vLive };
  $app.classList.toggle('quiet', !!quiet);
  $app.innerHTML = (views[S.screen] || vBeranda)();
  try { if (S.screen === 'beranda') initNet(); else if (netStop) netStop(); } catch (e) { /* animasi opsional */ }
  const navKey = S.screen === 'sesi' ? 'agenda' : S.screen;
  document.querySelectorAll('.tnav [data-nav], .bnav [data-nav]').forEach((b) => { if (b.dataset.nav === navKey) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button,[data-nav]'); if (!b || b.getAttribute('aria-disabled') === 'true') return;
  const ds = b.dataset;
  if (ds.nav) return go(ds.nav);
  if (ds.sesi) { const [d, i] = ds.sesi.split('-').map(Number); return go('sesi', { day: d, slot: i }); }
  if (ds.pickday) return go('agenda', { day: +ds.pickday, slot: 0 });
  if (ds.live) return go('live', { room: +ds.live });
  if (ds.room) return go('live', { room: +ds.room });
  if (ds.liveday) return go('live', { day: +ds.liveday });
  if (ds.rehat) return go('live', { tab: 'rehat' });
  if (ds.step) return go('sesi', { slot: Math.min(3, Math.max(0, S.slot + +ds.step)) });
  if (ds.save) {
    saved[ds.save] = !saved[ds.save]; persist();
    document.querySelectorAll(`[data-save="${ds.save}"]`).forEach((x) => { x.setAttribute('aria-pressed', !!saved[ds.save]); x.textContent = saved[ds.save] ? '◆ Tersimpan' : '◇ Simpan'; });
    return;
  }
  if (ds.tab) {
    S.tab = ds.tab;
    document.querySelectorAll('[role="tab"]').forEach((t) => t.setAttribute('aria-selected', t.dataset.tab === S.tab));
    document.querySelectorAll('[role="tabpanel"]').forEach((p) => p.classList.toggle('hidden', p.id !== 'pn-' + S.tab));
  }
});
/* Hitung mundur tiap detik; status & garis NOW tiap 30 detik (Ruang Live tidak dimuat ulang agar video/form tetap jalan) */
setInterval(() => { const t = document.getElementById('cdt'), l = document.getElementById('cdl'); if (t) { const c = cdText(); t.textContent = c.text; l.textContent = c.label; } }, 1000);
setInterval(() => { if (S.screen === 'agenda' || S.screen === 'sesi') { const y = window.scrollY; render(true); window.scrollTo({ top: y }); } }, 30000);
window.addEventListener('hashchange', () => { fromHash(); render(false); });
fromHash(); render(false);
</script>
